name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm ci

      - name: Lint and formatting
        run: npm run lint && npm run format:check

      - name: JavaScript syntax
        run: for f in js/*.js lib/*.js config.js sw.js; do node --check "$f"; done

      - name: Unit tests and example course
        run: npm test

      - name: Manifest is valid JSON
        run: node -e "JSON.parse(require('fs').readFileSync('manifest.webmanifest','utf8')); console.log('ok')"

      - name: No secret keys in the repository
        run: |
          if grep -rIlE "service_role|sb_secret_" --exclude-dir=.git --exclude-dir=vendor --exclude-dir=node_modules --exclude=ci.yml --exclude=README.md --exclude=config.js .; then
            echo "Possible secret key found" && exit 1
          fi

      - name: Every table has row level security
        run: |
          for f in schema.sql push.sql migrations/*.sql; do
            tables=$(grep -oE "create table if not exists public\.[a-z_]+" $f | awk -F. '{print $2}' | sort -u)
            for t in $tables; do
              grep -q "alter table public.$t *enable row level security" $f || { echo "RLS missing on $t in $f"; exit 1; }
            done
          done
          echo "RLS ok"
